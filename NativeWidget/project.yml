name: SpotifyWidget
options:
  bundleIdPrefix: com.sztjonathan
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  SpotifyWidget:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_NAME: Spotify Widget
        PRODUCT_BUNDLE_IDENTIFIER: com.sztjonathan.spotifywidget
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - target: SpotifyWidgetExtension
  SpotifyWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sztjonathan.spotifywidget.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
